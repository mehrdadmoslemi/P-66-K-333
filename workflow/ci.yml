# Workflow CI/CD برای تست‌های ماژولار P-66
# این فایل برای اعتبارسنجی خودکار اسکیمای K-333 و نمونه‌های K-336 طراحی شده است

name: CI/CD Validation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  validate-schema:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Validate K-333 JSON Schema
      run: |
        python -c "
        import json
        import jsonschema
        
        with open('schema/K-333.json', 'r') as f:
            schema = json.load(f)
        
        with open('samples/bert-base-fixture.json', 'r') as f:
            instance = json.load(f)
        
        jsonschema.validate(instance, schema)
        print('✓ Schema validation passed for K-333')
        "

  test-fixtures:
    runs-on: ubuntu-latest
    needs: validate-schema
    steps:
    - uses: actions/checkout@v3
    - name: Run fixture tests
      run: |
        python -c "
        import json
        import jsonschema
        
        # Load schema
        with open('schema/K-333.json', 'r') as f:
            schema = json.load(f)
        
        # Test all fixtures in samples/
        import os
        for filename in os.listdir('samples'):
            if filename.endswith('.json'):
                with open(f'samples/{filename}', 'r') as f:
                    instance = json.load(f)
                try:
                    jsonschema.validate(instance, schema)
                    print(f'✓ {filename} passed validation')
                except jsonschema.ValidationError as e:
                    print(f'✗ {filename} failed: {e.message}')
                    exit(1)
        "

  audit-check:
    runs-on: ubuntu-latest
    needs: test-fixtures
    steps:
    - uses: actions/checkout@v3
    - name: Check for required K-100 fields
      run: |
        python -c "
        import json
        import os
        
        required_fields = [
            'owner_attested', 'deadline', 'run_id', 'raw_log', 'raw_log_hash',
            'model_hash', 'config_full', 'baseline_hash', 'iso-baseline'
        ]
        
        for filename in os.listdir('samples'):
            if filename.endswith('.json'):
                with open(f'samples/{filename}', 'r') as f:
                    data = json.load(f)
                missing = [f for f in required_fields if f not in data]
                if missing:
                    print(f'✗ {filename} missing fields: {missing}')
                    exit(1)
                print(f'✓ {filename} has all required K-100 fields')
        "

  report:
    runs-on: ubuntu-latest
    needs: [audit-check]
    steps:
    - name: Generate audit report
      run: |
        echo "CI/CD Pipeline Completed Successfully"
        echo "All fixtures validated against K-333 schema"
        echo "All required K-100 fields present"
